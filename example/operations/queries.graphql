query GetUser($userId: ID!, $friendId: ID) {
  user(id: $userId) {
    ...UserWithFriend @arguments(friendId: $friendId)
  }
}

query GetUserDetail($userId: ID!, $friendId: ID!, $showEmail: Boolean) {
  user(id: $userId) {
    ...UserDetail @arguments(friendId: $friendId, showEmail: $showEmail)
  }
}

query GetPost($postId: ID!) {
  post(id: $postId) {
    ...PostBasic
    author {
      id
      name
    }
  }
}
